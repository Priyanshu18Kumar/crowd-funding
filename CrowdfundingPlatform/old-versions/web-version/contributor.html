<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CrowdFund - Contributor Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/app.js"></script>
</head>
<body data-page="contributor">

  <header class="topbar">
    <h1>CrowdFund - Contributor</h1>
    <div class="topbar-right">
      <span id="contributorName"></span>
      <button id="logoutBtn" class="small">Logout</button>
    </div>
  </header>

  <main class="container">

    <!-- Campaigns open for contribution -->
    <section class="card">
      <h2>Campaigns Open for Contribution</h2>
      <div id="campaignsBox"></div>
    </section>

    <!-- My contributions -->
    <section class="card">
      <h2>My Contributions</h2>
      <table>
        <thead>
          <tr><th>Campaign</th><th>Amount</th><th>Date</th></tr>
        </thead>
        <tbody id="myContribBody"></tbody>
      </table>
      <p>Total contributed: <strong id="totalContrib"></strong></p>
    </section>

    <!-- Campaign updates -->
    <section class="card">
      <h2>Campaign Updates</h2>
      <div id="updatesBox"></div>
    </section>

    <!-- Profile -->
    <section class="card">
      <h2>Manage Profile</h2>
      <form id="profileForm">
        <label for="profileName">Name</label>
        <input type="text" id="profileName" required>

        <label for="profileEmail">Email</label>
        <input type="email" id="profileEmail" required>

        <button type="submit">Save</button>
      </form>
      <p id="profileMessage" class="message"></p>
    </section>

  </main>

</body>
</html>
