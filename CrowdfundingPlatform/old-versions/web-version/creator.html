<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CrowdFund - Creator Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/app.js"></script>
</head>
<body data-page="creator">

  <header class="topbar">
    <h1>CrowdFund - Creator</h1>
    <div class="topbar-right">
      <span id="creatorName"></span>
      <button id="logoutBtn" class="small">Logout</button>
    </div>
  </header>

  <main class="container">

    <!-- Create campaign -->
    <section class="card">
      <h2>Create a Campaign</h2>
      <form id="createCampaignForm">
        <label for="campTitle">Title</label>
        <input type="text" id="campTitle" required>

        <label for="campDesc">Description</label>
        <input type="text" id="campDesc" required>

        <label for="campGoal">Goal amount</label>
        <input type="number" id="campGoal" min="1" required>

        <button type="submit">Create Campaign</button>
      </form>
      <p id="createMessage" class="message"></p>
    </section>

    <!-- My campaigns -->
    <section class="card">
      <h2>My Campaigns</h2>
      <table>
        <thead>
          <tr><th>ID</th><th>Title</th><th>Goal</th><th>Raised</th><th>Progress</th><th>Status</th></tr>
        </thead>
        <tbody id="myCampaignsBody"></tbody>
      </table>
    </section>

    <div class="two-col">

      <!-- Progress update -->
      <section class="card">
        <h2>Post a Progress Update</h2>
        <form id="updateForm">
          <label for="updateCampaignId">Campaign ID</label>
          <input type="number" id="updateCampaignId" min="1" required>

          <label for="updateMessage">Message</label>
          <input type="text" id="updateMessage" required>

          <button type="submit">Post Update</button>
        </form>
        <p id="updateMsg" class="message"></p>
      </section>

      <!-- Message contributors -->
      <section class="card">
        <h2>Message Contributors</h2>
        <form id="messageForm">
          <label for="msgCampaignId">Campaign ID</label>
          <input type="number" id="msgCampaignId" min="1" required>

          <label for="msgText">Message</label>
          <input type="text" id="msgText" required>

          <button type="submit">Send</button>
        </form>
        <p id="msgResult" class="message"></p>
      </section>

    </div>

    <!-- Analytics -->
    <section class="card">
      <h2>Campaign Analytics</h2>
      <div id="analyticsBox"></div>
    </section>

  </main>

</body>
</html>
